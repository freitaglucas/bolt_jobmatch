name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase db start

      - name: Expose local database URL
        # `-o env` imprime todas as variaveis (API_URL, DB_URL, ANON_KEY...);
        # nao aceita um nome de variavel avulso como argumento posicional.
        run: supabase status -o env >> "$GITHUB_ENV"

      - name: Re-run seeds to verify idempotency
        # Executa os dois arquivos de seed uma segunda vez (o `supabase db
        # start` acima ja aplicou migracoes + seeds uma primeira vez). Os
        # testes pgTAP a seguir conferem as contagens finais (ex.: exatamente
        # 50 vagas do recrutador de teste, sem nomes de skill duplicados) —
        # se algum insert do seed nao fosse idempotente, essa segunda
        # execucao teria duplicado linhas e essas contagens quebrariam.
        run: |
          command -v psql >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y --no-install-recommends postgresql-client)
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/seeds/01_skills.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/seeds/02_test_recruiter_and_jobs.sql

      - name: Run pgTAP RLS tests
        run: supabase test db
